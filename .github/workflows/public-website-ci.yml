name: Public Website CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signup-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
