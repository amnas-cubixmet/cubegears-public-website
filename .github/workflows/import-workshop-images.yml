name: Import local workshop images (one time)

on:
  push:
    branches:
      - design/full-premium-automotive-site-20261107
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: design/full-premium-automotive-site-20261107
          persist-credentials: true
      - name: Install Python image optimization library
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and optimize verified Pexels photos
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          from PIL import Image, ImageOps, UnidentifiedImageError
          import time

          photos = {
              "car-workshop": 33814734,
              "car-service": 8985456,
              "car-team": 15489247,
              "car-engine": 8985461,
              "car-inspection": 8985917,
              "garage-interior": 4116209,
              "bike-repair": 11890964,
              "bike-team": 3822784,
              "bike-service": 3806255,
          }
          out = Path("public/images")
          out.mkdir(parents=True, exist_ok=True)
          for name, photo_id in photos.items():
              destination = out / f"{name}.webp"
              if destination.is_file() and destination.stat().st_size > 12000:
                  print("Already available:", name)
                  continue
              url = (f"https://images.pexels.com/photos/{photo_id}/"
                     f"pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1600")
              error = None
              for attempt in range(1, 4):
                  try:
                      req = Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (compatible; CubeGearsImageImport/1.0)",
                          "Accept": "image/avif,image/webp,image/jpeg,image/*",
                      })
                      with urlopen(req, timeout=35) as response:
                          raw = response.read()
                      image = Image.open(BytesIO(raw))
                      image = ImageOps.exif_transpose(image).convert("RGB")
                      image.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                      image.save(destination, format="WEBP", quality=83, method=6)
                      if destination.stat().st_size < 12000:
                          raise ValueError("Unexpectedly small image")
                      print(f"Saved {name}: {image.width}x{image.height}, {destination.stat().st_size} bytes")
                      error = None
                      break
                  except (HTTPError, URLError, OSError, ValueError, UnidentifiedImageError) as exc:
                      error = f"{type(exc).__name__}: {exc}"
                      time.sleep(attempt * 3)
              if error:
                  raise RuntimeError(f"Could not download {name} (Pexels #{photo_id}): {error}")
          print("All nine locally hosted workshop photos are available.")
          PY
      - name: Commit local assets to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle optimized car and bike workshop photography"
            git push origin HEAD:design/full-premium-automotive-site-20261107
          else
            echo "No new image assets to commit"
          fi
