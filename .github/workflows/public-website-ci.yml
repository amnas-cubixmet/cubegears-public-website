name: Public Website CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signup-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: node --test tests/signup-no-location.test.mjs
      - run: npm run lint
      - run: npm run build
